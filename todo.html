<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saratu's To-Do App</title>
  <style>
    body { font-family: Arial; background: #f0f8ff; padding: 20px; }
    .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    h1 { color: #007bff; text-align: center; }
    input { width: 70%; padding: 10px; border: 2px solid #007bff; border-radius: 5px; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    li { padding: 10px; margin: 5px 0; background: #e7f3ff; border-radius: 5px; list-style: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 My To-Do List</h1>
    <input type="text" id="task" placeholder="Add a new task...">
    <button onclick="addTask()">Add</button>
    <ul id="list"></ul>
  </div>

  <script>
    function addTask() {
      let task = document.getElementById("task").value;
      if(task === "") return;
      let li = document.createElement("li");
      li.textContent = task;
      li.onclick = function(){ this.remove(); }
      document.getElementById("list").appendChild(li);
      document.getElementById("task").value = "";
    }
  </script>
</body>
</html>
